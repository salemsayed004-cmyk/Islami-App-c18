name: islami
description: "islami app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  intl: ^0.19.0
  hijri: ^3.0.0
  adhan: ^2.0.0+1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.5.5
  carousel_slider: ^5.1.2
  dio: ^5.9.2
  just_audio: ^0.10.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0        # ← was missing from dependencies

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.9.0
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0
  # dart_style is intentionally removed — it conflicts with your Dart SDK version

flutter_gen:
  output: lib/core/gen/
  integrations:
    image: true
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/files/quran/
    - assets/files/hadith/

  fonts:
    - family: Janna
      fonts:
        - asset: assets/fonts/janna_lt_bold.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf